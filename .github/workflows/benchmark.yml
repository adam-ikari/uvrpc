name: Benchmark

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering
  schedule:
    - cron: '17 3 * * 0'  # weekly (Sun 03:17 UTC), off-peak

# Run benchmarks on demand / on PRs to main. Uses perf_benchmark (correct
# loop usage — UV_RUN_ONCE, sequential ping-pong).
jobs:
  benchmark:
    name: Performance benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Build vendored dependencies
        run: ./scripts/setup_deps.sh

      - name: Build (Release, logging OFF)
        run: |
          cmake -S . -B build \
            -DUVRPC_ALLOCATOR_DEFAULT=system \
            -DCMAKE_BUILD_TYPE=Release \
            -DUVRPC_DEBUG_LOGGING=OFF
          make -C build -j$(nproc) perf_benchmark

      - name: Run perf_benchmark (all transports)
        run: |
          {
            echo "## Performance benchmark (sequential ping-pong)"
            echo ""
            echo "Release build, system allocator, debug logging OFF, single thread, 8-byte payload."
            echo ""
            echo "| Transport | Round-trip latency | Throughput (1/latency) |"
            echo "|-----------|--------------------|------------------------|"
            for t in sameloop inproc ipc udp tcp; do
              # Capture the two result lines and reformat as a table row.
              out=$(./dist/bin/perf_benchmark 50000 "$t" 2>/dev/null)
              lat=$(echo "$out" | grep -oE '[0-9.]+ us/req' | head -1)
              thr=$(echo "$out" | grep -oE '[0-9,]+ req/s' | head -1)
              echo "| $t | $lat | $thr |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stress run (1M requests, same-loop)
        run: |
          ./dist/bin/perf_benchmark 1000000 sameloop 2>/dev/null
