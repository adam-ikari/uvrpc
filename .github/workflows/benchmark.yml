name: Benchmark

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering
  schedule:
    - cron: '17 3 * * 0'  # weekly (Sun 03:17 UTC), off-peak

# Run benchmarks on demand / on PRs to main. Uses perf_benchmark (correct
# loop usage — UV_RUN_ONCE, sequential ping-pong).
jobs:
  benchmark:
    name: Performance benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Build vendored dependencies
        run: ./scripts/setup_deps.sh

      - name: Build (Release, logging OFF)
        run: |
          cmake -S . -B build \
            -DUVRPC_ALLOCATOR_DEFAULT=system \
            -DCMAKE_BUILD_TYPE=Release \
            -DUVRPC_DEBUG_LOGGING=OFF
          make -C build -j$(nproc) perf_benchmark

      # One sample is not a measurement. A single 50k run on a shared runner
      # varied by 2-3x between consecutive runs, which is larger than any cost
      # a code change of interest would add -- so a single number cannot tell
      # you whether a change helped. Each transport is sampled several times and
      # the spread is reported alongside the median.
      - name: Run perf_benchmark (all transports, N samples)
        run: |
          SAMPLES=5
          REQUESTS=100000
          {
            echo "## Performance benchmark (sequential ping-pong)"
            echo ""
            echo "Release build, system allocator, debug logging OFF, single thread, 8-byte payload."
            echo "Each transport sampled $SAMPLES times with $REQUESTS requests per run; the median is the"
            echo "comparable number and the min-max spread says how much this host can be trusted."
            echo ""
            echo "| Transport | Median latency | Median throughput | Best | Worst | Spread |"
            echo "|-----------|----------------|-------------------|------|-------|--------|"
            for t in sameloop inproc ipc udp tcp; do
              : > /tmp/lat.$t
              for i in $(seq 1 $SAMPLES); do
                out=$(./dist/bin/perf_benchmark "$REQUESTS" "$t" 2>/dev/null)
                lat=$(echo "$out" | grep -oE '[0-9.]+ us/req' | head -1 | grep -oE '[0-9.]+')
                [ -n "$lat" ] && echo "$lat" >> /tmp/lat.$t
              done
              if [ ! -s /tmp/lat.$t ]; then
                echo "| $t | (no result) | | | | |"
                continue
              fi
              med=$(sort -n /tmp/lat.$t | awk '{a[NR]=$1} END {print a[int((NR+1)/2)]}')
              lo=$(sort -n /tmp/lat.$t | head -1)
              hi=$(sort -n /tmp/lat.$t | tail -1)
              thr=$(awk -v l="$med" 'BEGIN {printf "%.0f", 1000000/l}')
              spread=$(awk -v lo="$lo" -v hi="$hi" 'BEGIN {printf "%.1fx", hi/lo}')
              echo "| $t | $med us | $thr req/s | $lo us | $hi us | $spread |"
              echo "    samples(us): $(tr '\n' ' ' < /tmp/lat.$t)"
            done
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Stress run (1M requests, same-loop)
        run: |
          ./dist/bin/perf_benchmark 1000000 sameloop 2>/dev/null
