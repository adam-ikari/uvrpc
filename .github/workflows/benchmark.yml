name: Benchmark Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  network-transports:
    name: Network Transport Benchmark (${{ matrix.transport }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        transport: [ipc, tcp, udp]
        clients: [1, 10, 50]
        include:
          - clients: 1
            requests: 10000
            timeout: 60
          - clients: 10
            requests: 10000
            timeout: 120
          - clients: 50
            requests: 10000
            timeout: 180
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libuv1-dev
    
    - name: Build
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        make -C build -j$(nproc)
    
    - name: Run benchmark - ${{ matrix.transport }} (${{ matrix.clients }} clients)
      timeout-minutes: 10
      run: |
        cd benchmark
        echo "=== Testing ${{ matrix.transport }} with ${{ matrix.clients }} clients ==="
        timeout ${{ matrix.timeout }} ./dist/bin/uvrpc_benchmark \
          --transport ${{ matrix.transport }} \
          --clients ${{ matrix.clients }} \
          --requests ${{ matrix.requests }} \
          --warmup 100 || true
    
    - name: Cleanup processes
      if: always()
      run: |
        pkill -9 uvrpc_benchmark || true
        ps aux | grep uvrpc_benchmark || echo "No zombie processes"
    
    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: benchmark-${{ matrix.transport }}-${{ matrix.clients }}clients
        path: |
          benchmark/BENCHMARK_REPORT.md
          benchmark/PERFORMANCE_TEST_RESULTS.md
        retention-days: 30

  inproc-transports:
    name: In-Process Transport Benchmark
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libuv1-dev
    
    - name: Build
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        make -C build -j$(nproc)
    
    - name: Run INPROC benchmark
      run: |
        cd benchmark
        echo "=== Testing INPROC transport ==="
        timeout 60 ./dist/bin/uvrpc_benchmark \
          --transport inproc \
          --requests 100000 \
          --warmup 1000 || true
    
    - name: Run SAMELOOP benchmark
      run: |
        cd benchmark
        echo "=== Testing SAMELOOP transport ==="
        timeout 60 ./dist/bin/uvrpc_benchmark \
          --transport sameloop \
          --requests 100000 \
          --warmup 1000 || true
    
    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: benchmark-inproc
        path: |
          benchmark/BENCHMARK_REPORT.md
          benchmark/PERFORMANCE_TEST_RESULTS.md
        retention-days: 30

  stress-test:
    name: High-Concurrency Stress Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libuv1-dev
    
    - name: Build
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        make -C build -j$(nproc)
    
    - name: Run stress test - 100 clients, 50K requests
      timeout-minutes: 15
      run: |
        cd benchmark
        echo "=== High-Concurrency Stress Test ==="
        for transport in ipc tcp; do
          echo "Testing $transport with 100 clients and 50K requests"
          timeout 300 ./dist/bin/uvrpc_benchmark \
            --transport $transport \
            --clients 100 \
            --requests 50000 \
            --warmup 500 || true
        done
    
    - name: Cleanup processes
      if: always()
      run: |
        pkill -9 uvrpc_benchmark || true
        ps aux | grep uvrpc_benchmark || echo "No zombie processes"
    
    - name: Upload stress test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: benchmark-stress-test
        path: |
          benchmark/BENCHMARK_REPORT.md
          benchmark/PERFORMANCE_TEST_RESULTS.md
        retention-days: 30

  report:
    name: Generate Benchmark Report
    runs-on: ubuntu-latest
    needs: [network-transports, inproc-transports, stress-test]
    if: always()
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v3
      with:
        path: benchmark-results
    
    - name: Generate summary
      run: |
        echo "# Benchmark Test Summary" > summary.md
        echo "" >> summary.md
        echo "## Test Results" >> summary.md
        echo "- Network Transport Benchmarks: ${{ needs.network-transports.result }}" >> summary.md
        echo "- In-Process Transport Benchmarks: ${{ needs.inproc-transports.result }}" >> summary.md
        echo "- Stress Tests: ${{ needs.stress-test.result }}" >> summary.md
        echo "" >> summary.md
        echo "For detailed results, check the uploaded artifacts." >> summary.md
        cat summary.md
    
    - name: Upload summary
      uses: actions/upload-artifact@v3
      with:
        name: benchmark-summary
        path: summary.md
        retention-days: 30