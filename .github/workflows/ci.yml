name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.build_type }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, ubuntu-latest ]
        build_type: [ Debug, Release ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Build vendored dependencies
        run: ./scripts/setup_deps.sh

      - name: Configure
        run: |
          cmake -S . -B build \
            -DUVRPC_BUILD_TESTS=ON \
            -DUVRPC_BUILD_EXAMPLES=ON \
            -DUVRPC_ALLOCATOR_DEFAULT=system \
            -DUVRPC_DEBUG_LOGGING=OFF \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: make -C build -j$(nproc)

      # Warning gate: the library compiles warning-clean under -Wall -Wextra
      # -Wpedantic. Treat warnings as errors so regressions fail CI. Excluded:
      # the known glibc static-link NSS warnings from libuv's core.c, and
      # generated/ -- flatcc emits code with -Wmisleading-indentation that we
      # do not own and cannot fix without a generator patch.
      - name: Check warnings (warning-clean build)
        run: |
          make -C build -j$(nproc) 2>&1 | tee build.log
          if grep -iE "warning:|error:" build.log \
             | grep -qvE "getpwuid_r|getgrgid_r|statically linked|generated/"; then
            echo "::error::Build produced warnings/errors (see log above)"
            exit 1
          fi

      - name: Run ctest
        run: |
          cd build
          ctest --output-on-failure

  debug-logging-build:
    # Verify the debug-logging build still compiles (macros must stay valid).
    name: Debug-logging build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
      - name: Build vendored dependencies
        run: ./scripts/setup_deps.sh
      - name: Configure & build with debug logging
        run: |
          cmake -S . -B build -DUVRPC_BUILD_TESTS=ON -DUVRPC_ALLOCATOR_DEFAULT=system \
                -DCMAKE_BUILD_TYPE=Debug -DUVRPC_DEBUG_LOGGING=ON
          make -C build -j$(nproc)

  memory-check:
    name: Memory leak detection (ASan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
      - name: Build vendored dependencies
        run: ./scripts/setup_deps.sh
      - name: Build with AddressSanitizer
        run: |
          cmake -S . -B build -DUVRPC_BUILD_TESTS=ON -DUVRPC_ALLOCATOR_DEFAULT=system \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_FLAGS="-fsanitize=address -g" \
                -DCMAKE_CXX_FLAGS="-fsanitize=address -g" \
                -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address -Wl,-rpath,$(pwd)/deps/gtest/build/lib"
          make -C build -j$(nproc)
      # Every test binary, not just two of them. The TCP use-after-free and
      # four leaks this job now catches were all invisible while it ran only
      # test_transport_lifetime and the unit tests; the other 15 binaries had
      # never seen a sanitizer. Leaks are part of the signal -- the 256 KB
      # per-connection struct that leaked on every server teardown only shows
      # up with detect_leaks=1.
      - name: Run all tests under ASan
        run: |
          ASAN_OPTIONS=detect_leaks=1 ./dist/bin/uvrpc_tests --gtest_brief=1
          ASAN_OPTIONS=detect_leaks=1 ctest --test-dir build --output-on-failure

  performance:
    name: Performance benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
      - name: Build vendored dependencies
        run: ./scripts/setup_deps.sh
      - name: Build (Release, logging OFF)
        run: |
          cmake -S . -B build -DUVRPC_ALLOCATOR_DEFAULT=system \
                -DCMAKE_BUILD_TYPE=Release -DUVRPC_DEBUG_LOGGING=OFF
          make -C build -j$(nproc) perf_benchmark
      - name: Run perf benchmark (all transports)
        run: |
          for t in sameloop inproc ipc udp tcp; do
            echo "::group::$t"
            ./dist/bin/perf_benchmark 10000 "$t"
            echo "::endgroup::"
          done

  default-allocator:
    # Cover the default build configuration (UVRPC_ALLOCATOR_DEFAULT=mimalloc)
    # so the vendored mimalloc path stays verified in CI.
    name: Default allocator build (mimalloc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
      - name: Build vendored dependencies
        run: ./scripts/setup_deps.sh
      - name: Configure & build (default flags)
        run: |
          cmake -S . -B build -DUVRPC_BUILD_TESTS=ON -DUVRPC_BUILD_EXAMPLES=ON \
                -DCMAKE_BUILD_TYPE=Release
          make -C build -j$(nproc)
      # The mimalloc path has its own gate: allocator wrappers are the only code
      # that touches mi_* directly, so a -Wpedantic regression there is invisible
      # to the system-allocator matrix above.
      - name: Check warnings (mimalloc build)
        run: |
          make -C build -j$(nproc) 2>&1 | tee build.log
          if grep -iE "warning:|error:" build.log \
             | grep -qvE "getpwuid_r|getgrgid_r|statically linked|generated/"; then
            echo "::error::Build produced warnings/errors (see log above)"
            exit 1
          fi
      - name: Verify merged archive keeps every dependency object
        run: |
          # uvrpc_merged folds libuv + mimalloc, which both ship src/random.c.
          # Historically the fold dropped one, leaving -l:libuvrpc_full.a with an
          # undefined uv_random.
          for sym in uv_random _mi_random_init; do
            nm --defined-only dist/lib/libuvrpc_full.a | grep -qw "$sym" \
              || { echo "::error::$sym missing from libuvrpc_full.a"; exit 1; }
          done
      - name: Run ctest
        run: |
          cd build
          ctest --output-on-failure

  custom-allocator:
    # The custom allocator is the only build where uvrpc_free() is a pool that
    # cannot release memory it did not hand out. That makes it the only build
    # able to catch a cross-heap free, e.g. releasing a flatcc-owned encode
    # buffer through uvrpc_free().
    name: Custom allocator build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
      - name: Build vendored dependencies
        run: ./scripts/setup_deps.sh
      - name: Configure & build (custom allocator)
        run: |
          cmake -S . -B build -DUVRPC_BUILD_TESTS=ON -DUVRPC_BUILD_EXAMPLES=ON \
                -DUVRPC_ALLOCATOR_DEFAULT=custom -DCMAKE_BUILD_TYPE=Release
          make -C build -j$(nproc)
      - name: Run ctest
        run: |
          cd build
          ctest --output-on-failure

  static-analysis:
    name: Static analysis (cppcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
      - name: Run cppcheck
        run: |
          cppcheck --enable=warning,performance,portability --inline-suppr \
            --suppress=missingIncludeSystem --error-exitcode=1 \
            -I include -I src -I generated -I deps/libuv/include \
            -I deps/uthash/include -I deps/flatcc/include \
            src/ include/

  docs:
    # A dead internal link fails the vitepress build. It used to surface only in
    # the deploy workflow, so a documentation break could reach main with CI
    # green; this makes it a pull-request gate instead.
    name: Documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: ./docs
        run: npm ci
      - name: Build documentation
        working-directory: ./docs
        run: npm run docs:build
